[project]
name = "agent-guild"
version = "1.1.0"
description = "A multi-agent setup for Claude Code (orchestrator + architect, coder, grader, utility subagents) with memory-bank, jevmem and Spec-Driven Development wired in, installed into a project with one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Illescas Romero", email = "illescas.daniel@protonmail.com" }]
keywords = ["claude-code", "claude", "subagents", "multi-agent", "orchestrator", "memory", "spec-driven-development", "sdd"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/illescasDaniel/agent-guild"
Issues = "https://github.com/illescasDaniel/agent-guild/issues"

[project.scripts]
agent-guild = "agent_guild.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guild"]

# The agents, templates and workflow rules live at the repo root; ship them inside the wheel too.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "agent_guild/_assets/agents"
"templates" = "agent_guild/_assets/templates"
"development-workflow.md" = "agent_guild/_assets/development-workflow.md"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
